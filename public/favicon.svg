<!--
  Canvas M favicon — neutral placeholder mark.
  A serif "M" (echoing the canvas-m.png wordmark) in the Glass-Desk dark
  tone (#121212) on a light rounded square. This is intentionally simple,
  NOT a final brand logo.
  TODO(canvas-m): replace public/favicon.svg + the rasterized
  favicon-16x16.png / favicon-32x32.png / favicon.ico /
  apple-touch-icon.png / android-chrome-192x192.png /
  android-chrome-512x512.png / maskable_icon_x192.png /
  maskable_icon_x512.png with the real square Canvas M brand icon.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <rect width="1000" height="1000" rx="200" ry="200" fill="#f5f3ef" />
  <text
    x="500"
    y="500"
    fill="#121212"
    font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif"
    font-size="720"
    font-weight="600"
    text-anchor="middle"
    dominant-baseline="central"
  >M</text>
</svg>

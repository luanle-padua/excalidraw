<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas M</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="referrer" content="origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121212" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Canvas M — collaborative design-review meetings on a shared canvas"
    />
    <meta
      name="description"
      content="Canvas M is an internal meeting tool for collaborative design reviews: shared canvas, live audio, real-time transcription, and AI summarisation."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Canvas M" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Canvas M — collaborative design-review meetings on a shared canvas"
    />
    <meta property="og:image:alt" content="Canvas M" />
    <meta
      property="og:description"
      content="Canvas M is an internal meeting tool for collaborative design reviews: shared canvas, live audio, real-time transcription, and AI summarisation."
    />

    <!------------------------------------------------------------------------->
    <!--   to minimize white flash on load when user has dark mode enabled   -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("excalidraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            return theme || "light";
          }
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>

    <!-- Warmup the connection for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Vietnamese + Korean canvas font support, plus Caveat — the new
      default handwritten font for MCM. Caveat ships native Vietnamese
      glyphs from Google so demos don't fall through to a substitute
      font for accented characters. Noto Sans + Noto Sans KR remain
      as tail fallbacks so any character missing from the user's
      currently-picked font (e.g. someone switches to Helvetica, then
      types Korean) still renders without "tofu" boxes.

      `display=swap` keeps Excalidraw's bundled font rendering during
      the brief Google fetch instead of blocking the first paint.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Noto+Sans:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap"
    />

    <!--
      Manrope — the MCM dashboard (Glass Desk / Olive Royal) UI typeface.
      Variable weight 300..800 covers Display-Hero 320 / Body 450 / Title 680
      / Display 760 (Type System 2026-06-12);
      ships a native Vietnamese subset so diacritics don't fall through to
      a substitute font. Scoped in CSS to .mcm-lobby + portal overlays only;
      the meeting canvas keeps the system/SF stack.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300..800&display=swap"
    />
    <!--
      Fraunces — digits ONLY (text=0123456789), one fixed instance
      opsz 144 / wght 560 (~5KB). Used solely for the Number-XL display
      numeral token (e.g. the day number on meeting-list day separators).
      Digits carry no Vietnamese diacritics and no Hangul, so this adds
      zero i18n risk; all running text stays Manrope/system.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@144,560&text=0123456789&display=swap"
    />
    <!--
      Cormorant Garamond — the elegant serif for the client-portal greeting
      (anh Luân 06-16). Full charset incl. Vietnamese; greeting text only, all
      other running text stays Manrope/system.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap"
    />

    <!------------------------------------------------------------------------->
    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!--
      (Removed) The upstream "Excalidraw+ auto-redirect" script used to bounce
      visitors with an `excplus-autoredirect` cookie to app.excalidraw.com.
      Canvas M is a standalone internal tool and must never redirect users to
      the original site, so the redirect has been deleted.
    -->

    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <!-- Register Assistant as the UI font, before the scene inits -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />

    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- SVG favicon: crisp at any DPI; modern browsers prefer it. PNG/ICO below
         are the fallbacks for older browsers. All generated from the Canvas M
         monogram (docs/logo/icon.svg). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- App version -->
    <meta name="version" content="{version}" />

    <% if (typeof VITE_APP_DEV_DISABLE_LIVE_RELOAD != 'undefined' &&
    VITE_APP_DEV_DISABLE_LIVE_RELOAD == true) { %>
    <script>
      {
        const _WebSocket = window.WebSocket;
        window.WebSocket = function (url) {
          if (/ws:\/\/localhost:.+?\/sockjs-node/.test(url)) {
            console.info(
              "[!!!] Live reload is disabled via VITE_APP_DEV_DISABLE_LIVE_RELOAD [!!!]",
            );
          } else {
            return new _WebSocket(url);
          }
        };
      }
    </script>
    <% } %>
    <script>
      // setting this so that libraries installation reuses this window tab.
      window.name = "_excalidraw";
    </script>

    <!-- FIXME: remove this when we update CRA (fix SW caching) -->
    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;

        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <header>
      <h1 class="visually-hidden">Canvas M</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
    <!--
      (Removed) Upstream Excalidraw loaded Simple Analytics
      (scripts.simpleanalyticscdn.com/latest.js) here in PROD. Canvas M is an
      internal tool with no need for third-party web analytics, and the request
      was flagged as ERR_BLOCKED_BY_CLIENT by ad/tracker blockers — noise in the
      console for zero benefit. Deleted.
    -->
  </body>
</html>
